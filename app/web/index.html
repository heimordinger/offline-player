<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0c0e16" />
  <title>离线播放器</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/icon.ico" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button type="button" class="btn-back" id="btn-back" aria-label="返回">← 返回</button>
      <img class="app-logo" src="/icon.ico" alt="" />
      <h1 id="header-title">离线播放器</h1>
    </header>

    <main class="app-main">
      <section id="view-games" class="view active">
        <p class="hint">连接电脑上的离线资源。请与电脑处于同一 WiFi；若使用 VPN，请开启「绕过局域网」。</p>
        <div id="games-list"></div>
      </section>

      <section id="view-categories" class="view">
        <p class="hint">选择分类</p>
        <div id="categories-grid" class="grid"></div>
      </section>

      <section id="view-items" class="view">
        <p class="hint">选择场景或作品</p>
        <div id="items-grid" class="grid"></div>
      </section>
    </main>
  </div>

  <div id="splash">
    <img class="splash-logo" src="/icon.ico" alt="" />
    <div class="splash-title">离线播放器</div>
    <div class="splash-spinner"></div>
    <div class="splash-line" id="splash-line">正在加载…</div>
    <div class="splash-sub" id="splash-sub"></div>
    <div class="progress-wrap">
      <div class="progress-label"><span>总进度</span><span id="splash-pct">8%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="splash-fill"></div></div>
    </div>
    <button type="button" class="splash-cancel" id="splash-cancel" hidden>取消</button>
  </div>

  <div id="player-view">
    <div class="reader-stage" id="player-stage"></div>
    <div class="adv-dialogue" id="adv-dialogue" hidden>
      <div class="adv-name" id="adv-name"></div>
      <div class="adv-text" id="adv-text"></div>
      <div class="adv-hint" id="adv-hint">点击继续</div>
    </div>
    <div class="reader-chrome show" id="reader-chrome">
      <div class="player-top">
        <button type="button" class="btn-ghost" id="player-close">关闭</button>
        <h2 id="player-title"></h2>
        <button type="button" class="btn-ghost" id="player-motion" hidden>动态</button>
        <button type="button" class="btn-ghost" id="player-more" aria-label="设置">···</button>
      </div>
      <div class="player-bottom" id="player-bottom">
        <span id="player-page"></span>
      </div>
    </div>
    <div class="sheet-mask" id="sheet-mask" hidden>
      <div class="reader-sheet" id="reader-sheet"></div>
    </div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
